<!-- Team Section -->
    <section id="team" class="bg-light-gray">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Members</h2>
                </div>
            </div>
            <div class="row team-members-row">
                {% for member in site.people %}
                <div class="col-sm-4">
                    <div class="team-member">
                        <img src="img/team/{{ member.pic }}" class="img-responsive img-circle" alt="">
                        <h4><a href="{{ member.website }}" target="_blank">{{ member.name }}</a></h4>
                        <p class="text-muted">{{ member.position }}</p>
                        <p class="text-muted">{{ member.description }}</p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
